  review_date: '2027-11-10'
  source_and_evidence: 'Metamodel clause: dea-metamodel schemas/entities/information-system-service.json
    (InformationSystemService, L5-integration). Admitting CR: CR-IS-CAT-03D (population; resolves ISC
    isc-rel-006). Vendor evidence (3 distinct vendor systems, evidence only per G-12): Amazon Web Services
    (identifier API Gateway); Microsoft Azure (identifier API Management); Google Cloud (identifier
    Apigee).'
