description: 'Vendor-neutral service record of the Payments sub-system of the Payment Processing Platform
  generic system class (Financial Services sector). Payment Retry Service is offered as a service contract;
  the substitutability test (CR-03A 4.1) passes: materially different vendor implementations can fulfil
  the same contract, so the record is filed here and not as a component. Provider: the Payments sub-system
  component of the Payment Processing Platform (see provided_by). Vendor corroboration is evidence only;
  at least 3 distinct vendor systems are cited and no vendor product is canonical (per G-12).'
