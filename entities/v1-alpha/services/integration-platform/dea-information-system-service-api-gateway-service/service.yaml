id: dea:information-system-service-api-gateway-service
type: InformationSystemService
name: API Gateway Service
description: 'Vendor-neutral API gateway service record: publication, protection and observation of
  APIs offered as a service contract to internal applications and external partner channels. The substitutability
  test (CR-03A 4.1) passes: materially different vendor implementations can fulfil the same contract.
  Provided by the API Gateway component of the Integration Platform class. Vendor corroboration is evidence
  only; at least 3 distinct vendor systems are cited and no vendor product is canonical (per G-12).
  Resolves the ISC forward reference isc-rel-006 declared by CR-IS-CAT-02D in dea-catalog-application-components.'
version: 1.0.0
lifecycle_status: active
service_kind: integration
consumer_class: mixed
interaction_pattern: request-response
external_references:
- system: Amazon Web Services
  identifier: API Gateway
- system: Microsoft Azure
  identifier: API Management
- system: Google Cloud
  identifier: Apigee
tags:
- service-kind:integration
- consumer-class:mixed
- interaction-pattern:request-response
- sector:technology-infrastructure-devops
- system-class:integration-platform
service_contract:
  offering: Publishes, secures, throttles and observes APIs on behalf of backend services.
  consumers:
  - Internal applications and external partner channels of the enterprise
  contract_status: published
provided_by:
- dea:information-system-component-api-gateway
exposed_via:
