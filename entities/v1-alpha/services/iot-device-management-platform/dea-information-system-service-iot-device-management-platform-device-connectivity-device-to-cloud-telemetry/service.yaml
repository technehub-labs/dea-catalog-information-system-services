  different vendor implementations can fulfil the same contract, so the record is filed here and not
  as a component. Provider: the Device Connectivity sub-system component of the IoT Device Management
  Platform (see provided_by). Vendor corroboration is evidence only; at least 3 distinct vendor systems
  are cited and no vendor product is canonical (per G-12).'
