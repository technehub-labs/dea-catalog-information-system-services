name: Fleet Deployment Service
description: 'Vendor-neutral service record of the Device Connectivity sub-system of the IoT Device
  Management Platform generic system class (Supply Chain & Manufacturing sector). Fleet Deployment Service
  is offered as a service contract; the substitutability test (CR-03A 4.1) passes: materially different
  vendor implementations can fulfil the same contract, so the record is filed here and not as a component.
  Provider: the Device Connectivity sub-system component of the IoT Device Management Platform (see
  provided_by). Vendor corroboration is evidence only; at least 3 distinct vendor systems are cited
  and no vendor product is canonical (per G-12).'
