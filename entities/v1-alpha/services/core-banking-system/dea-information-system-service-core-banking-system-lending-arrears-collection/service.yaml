description: 'Vendor-neutral service record of the Lending sub-system of the Core Banking System generic
  system class (Financial Services sector). Arrears & Collection Service is offered as a service contract;
  the substitutability test (CR-03A 4.1) passes: materially different vendor implementations can fulfil
  the same contract, so the record is filed here and not as a component. Provider: the Lending sub-system
  component of the Core Banking System (see provided_by). Vendor corroboration is evidence only; at
  least 3 distinct vendor systems are cited and no vendor product is canonical (per G-12).'
